<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th  style="text-align: left">web technology</th>
            <th>Month</th>
        </tr>
        <tr>
            <td style="text-align: right; vertical-align: bottom;" >2025</td>
            <td>April</td>
        </tr>
        <tr>
            <td>2025</td>
            <td>December</td>
        </tr>
    </table>
<hr>
    <table border="1" cellpadding="10" cellspacing="5">
        <!-- cellpadding is the space between 2 cols is more -->
        <thead>
            <tr>
                <th>Header 1</th>
                <th>Header 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td valign="top">Data 1</td>
                <td>Data 2</td>
            </tr>
        </tbody>
    </table>
    <hr>
    <table border="1">
        <tr>
            <th colspan="2">Header 1</th>
            <th>Header 2</th>
        </tr>
        <tr>
            <td rowspan="2">Data 1</td>
            <td>Data 2</td>
            <td>Data 3</td>
        </tr>
    </table>
</body>
</html>
