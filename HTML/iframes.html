<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrames</title>
</head>
<body>
    <iframe src="https://www.google.com/maps" name="Maps"></iframe>
        <a href="https://theoppty.com/EMPLOYEEOPpty/dashboard/dashboard.html" target="Maps">
            Open Maps
        </a>
    <hr>
    <iframe srcdoc="<h1>Welcome to Iframes</h1>">
    </iframe>
    <hr>
    <iframe src="https://theoppty.com/EMPLOYEEOPpty/dashboard/dashboard.html" sandbox="allow-scripts">
    </iframe>
    <hr>
    <iframe src="https://youtu.be/GVizJ_jpUnw?si=0NVqqyFc-_aoWgM6" autoplay></iframe>
    <a href="https://youtu.be/GVizJ_jpUnw?si=0NVqqyFc-_aoWgM6" target="_blank">Open Video</a>
</body>
</html>
