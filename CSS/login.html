<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body{
            background: white;
        }
        .box{
            color: white;
            border-radius: 20px;
            width: 1200px;
            height: 400px;
            display: flex;
            margin-top: 80px;
            margin-left: 100px;
            margin-right: 400px;
            margin-bottom: 300px;
            box-shadow: 0px 0px 30px black;

        }
        .aa{
            background-color: white;
            color: black;
            width: 600px;
            height: 320px;
            border-radius: 20px 0px 0px 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .aa h2{
            color: black;
            font-size: 40px;
        }
        .aa p{
            color: black;
            font-size: 15px;
        }
        input{
            background-color: whitesmoke;
            height: 35px;
            width: 250px;
            border: none;
        }
        .btn{
            background-color:aqua;
            color: white;
            border-radius: 30px;
            border: none;
            padding: 10px 20px;
            
        }
        .bt{
            border: 2px white solid;
            border-radius: 30px;
            background-color:aqua;
            color: white;
            padding: 10px 20px;
        }
        .bb{
            background-color:aqua;
            color: white;
            width: 600px;
            height: 320px;
            border-radius: 0px 20px 20px 0px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .bb h2{
            color: white;
            font-size: 40px;
        }
        .bb p{
            color: white;
            font-size: 25px;
        }
        .ii{
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="aa">
            <h2 style="align-items: center;">Sign in</h2>
            <div class="ii">
                <img src="./assets/fb.png" height="40px" width="40px">
                <img src="./assets/google.png" height="40px" width="40px">
                <img src="./assets/insta.png" height="40px" width="40px">
            </div>
        <form>
            <label for="useremail"></label>
            <input type="email" id="useremail" name="useremail" placeholder="User Email"><br><br>
            <label for="password"></label>
            <input type="password" id="password" name="password" placeholder="Password"><br><br>
        </form>
        <p>Forget your password?</p>
        <button class="btn">SIGN IN</button>
        </div>
        <div class="bb">
            <h2>Sign Up</h2>
            <p>Sign up if your have account</p>
            <button class="bt">SIGN UP</button>
        </div>
    </div>
</body>
</html>
