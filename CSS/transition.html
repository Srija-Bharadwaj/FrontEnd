<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <style>
        .a{
            display: flex;
            gap: 4px;
        }
        .box{
            width: 250px;
            height: 250px;
            background-color: purple;
            transition: all 1s ease;
        }
        .box:hover{
            width: 450px;
            height: 450px;
            background-color: red;
            border-radius: 50%;
        }


        .box1{
            width:250px;
            height:250px;
            background-color: black;
            transition: background-color 1s;
        }
        .box1:hover{
            background-color:blue;
        }


        .box2{
            width:250px;
            height:250px;
            background-color:coral;
            transition: width 1s;
            transition: height 1s;;
        }
        .box2:hover{
            width:450px;
            height: 500px;
        }


        .box4{
            width: 250px;
            height: 250px;
            background-color: green;
            transition: border-radius 1s;
        }
        .box4:hover{
            border-radius: 50%;
        }


        .box5{
            width: 250px;
            height: 250px;
            background-color: greenyellow;
            transition: transform 1s;
        }
        .box5:hover{
            transform: rotate(180deg);
        }


        .box6{
            width: 250px;
            height: 250px;
            background-color: orange;
            transition: transform 1s;
        }
        .box6:hover{
            transform: scale(1.5);
            transform: matrix(1.2,0,0,1.2,100,0);
        }

        .box7{
            width:250px;
            height:250px;
            background-color: rgb(226, 161, 172);
            transition: opacity 1s;
        }
        .box7:hover{
            opacity:0.3;
        }


        .box8{
            width:250px;
            height:250px;
            background-color:purple;
            transition: box-shadow 1s;
        }
        .box8:hover{
            box-shadow:0px 0px 30px black;
        }


        .box9{
            width:250px;
            height:250px;
            background-color: rgb(87, 112, 50);
            transition: transform 1s;
        }

        .box9:hover{
            transform: matrix(1.2,1,0,1.2,100,0);
        }
    </style>
</head>
<body>
    <div class="a">
        <!-- transition all -->
        <div class="box"></div> 

        <!-- Background color only -->
        <div class="box1"></div>

        <!-- width only -->
        <div class="box2"></div>

        <!-- height only -->
        <!-- <div class="box3"></div> -->

        <!-- border radius only -->
        <div class="box4"></div>

        <!-- rotate -->
        <div class="box5"></div>

        <!-- scale -->
        <div class="box6"></div>

        <!-- opacity -->
        <div class="box7"></div>

        <!-- box shadow -->
        <div class="box8"></div>

    </div>
    <!-- matrix -->
    <div class="box9"></div>
</body>
</html>
