<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id Card</title>
    <style>
        body{
            background: rgb(216, 244, 213);
        }
        .box{
            width: 700px;
            height: 500px;
            background-color: white;
            margin: 50px auto;
            border-radius: 30px;
            border: 1px solid rgb(146, 253, 146);
        }
        .cvr{
            display:flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            background-color: rgb(146, 253, 146);
            width: 100%;
            height: 120px;
            border-radius: 30px 30px 0px 0px;
        }
        .cvr h1{
            font-size: 30px;
            letter-spacing: 5px;
        }
        .dt{
            display: flex;
            flex-direction: row;
            padding: 20px;
            align-items: flex-start;
            justify-content: space-around;
        }
        .d input{
            border-top: 0px;
            border-left: 0px;
            border-right: 0px;
            width: 280px;
        }
        .d label{
            width: 55px;
            font-size:18px;
        }
        .qq{
            display: flex;
            flex-direction: row;
            margin-left: 250px;
            justify-content: space-around;
        }
        .qq img{
            width: 180px;
        }
        .qq input{
            border-top: 0px;
            border-left: 0px;
            border-right: 0px;
            width: 200px;
        }
        .pr{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pr input{
            width:150px;
            border-top:none;
            border-left:none;
            border-right:none;
        }
        .pr p{
            margin: 0px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="cvr">
            <img src="./assets/cvr.png" width="65px" height="65px">
            <h1>SCHOOL NAME</h1>
        </div>
        <div class="dt">
            <div>
                <img src="./assets/girl.png" width="180px" height="220px">
            </div>
            <div class="d">
                <label for="id">ID</label>
                <input type="text" id="id" name="id">
                <br><br>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
                <br><br>
                <label for="class">Class</label>
                <input type="text" id="class" name="class">
                <br><br>
                <label for="dob">D.O.B</label>
                <input type="text" id="dob" name="dob">
                <br><br>
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
                <br><br>
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">
            </div>
        </div>
        <div class="qq">
            <img src="./assets/qr.png">
            <div class="pr">
                <input type="text" id="principal" name="principal">
                <br>
                <p>Principal</p>
            </div>
        </div>
    </div>
</body>
</html>
