<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place an Order</title>
    <style>
        /* BODY */
        body{
            background-color: #dcdcdc;
            font-family: Georgia, serif;
        }

        /* MAIN CONTAINER */
        .container{
            width: 800px;
            margin: 20px auto;
            background-color: #57a97a;
            padding: 20px;
        }

        /* TOP HEADING */
        .heading{
            background-color: #57a97a;
            text-align: center;
            padding: 10px;
        }

        .heading h1{
            font-size: 70px;
            margin: 0;
            color: black;
            text-shadow: 3px 3px 10px white;
        }

        /* WHITE FORM BOX */
        .form-box{
            background-color: white;
            width: 650px;
            margin: 20px auto;
            padding: 20px 40px;
            border-radius: 5px;
        }

        /* BILLING ADDRESS */
        .form-box h2{
            font-size: 55px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* FORM ROW */
        .form-group{
            margin-bottom: 25px;
        }

        /* LABEL */
        label{
            display: inline-block;
            width: 180px;
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-right: 10px;
        }

        /* INPUT */
        input{
            width: 200px;
            height: 28px;
            border: 1px solid lightgray;
        }

        /* SELECT */
        select{
            width: 70px;
            height: 35px;
        }

    </style>

</head>

<body>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- HEADING -->
        <div class="heading">

            <h1>Place an Order</h1>

        </div>

        <!-- FORM BOX -->
        <div class="form-box">

            <h2>Billing Address</h2>

            <form>

                <!-- FIRST NAME -->
                <div class="form-group">

                    <label>First name</label>

                    <input type="text">

                </div>

                <!-- LAST NAME -->
                <div class="form-group">

                    <label>Last name</label>

                    <input type="text">

                </div>

                <!-- STREET ADDRESS -->
                <div class="form-group">

                    <label>Street Address</label>

                    <input type="text">

                </div>

                <!-- CITY -->
                <div class="form-group">

                    <label>City</label>

                    <input type="text">

                </div>

                <!-- STATE -->
                <div class="form-group">

                    <label>State</label>

                    <select>
                        <option>Select</option>
                        <option>Telangana</option>
                        <option>Andhra Pradesh</option>
                        <option>Tamil Nadu</option>
                        <option>Kerala</option>
                    </select>
                </div>
            </form>

        </div>

    </div>

</body>
</html>
